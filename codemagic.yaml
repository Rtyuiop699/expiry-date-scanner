workflows:
  android-release:
    name: Android Release APK

    environment:
      java: 17

      android_signing:
        - expiry_release

    scripts:
      - name: Print signing SHA-1
        script: |
          keytool -list -v -keystore "$CM_KEYSTORE_PATH" -alias "$CM_KEY_ALIAS" -storepass "$CM_KEYSTORE_PASSWORD" | grep -E 'SHA1|SHA-1'
      - name: Build Release APK
        script: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

    artifacts:
      - app/build/outputs/apk/release/*.apk
